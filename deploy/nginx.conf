# ============================================================================
# HANACV2SQL Enterprise - reverse proxy + TLS termination
# ============================================================================
#
# Drop this in front of the Docker stack so users reach the app at
# https://<host>/ instead of http://<host>:3000/.
#
# What this proxy does:
#   - Terminates TLS on :443
#   - Serves the frontend (port 3000) on /
#   - Proxies /api/* and /health to the backend (port 8080)
#   - Sends HSTS, X-Frame-Options, etc. on responses it handles
#
# Deploy options:
#   A) System nginx on the host VM, this file at /etc/nginx/conf.d/hanacv2sql.conf
#   B) Add an nginx sidecar container in docker-compose.enterprise.yml
#
# Before running:
#   1. Replace `hanacv2sql.client.local` with the customer's hostname.
#   2. Replace the certificate paths under ssl_certificate* - either:
#        - Customer-issued cert (preferred for production)
#        - Self-signed (test only - browsers will warn)
#        - Lets Encrypt cert (renew via certbot, see deploy/README.md)
#   3. Reload:  nginx -s reload   (system nginx)
#                docker compose restart nginx-proxy   (sidecar)
#
# ============================================================================

# Connection tuning - reasonable defaults for an internal app
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------------
    # Upstreams - internal Docker network names from docker-compose
    # ------------------------------------------------------------------------
    upstream h2s_frontend {
        server frontend:3000;
    }
    upstream h2s_backend {
        server backend:8080;
    }

    # ------------------------------------------------------------------------
    # Hardening
    # ------------------------------------------------------------------------
    server_tokens off;
    client_max_body_size 200m;     # bulk ZIP uploads can be large
    proxy_read_timeout 3600s;      # long conversions (backend has 1h timeout)
    proxy_send_timeout 3600s;

    # ------------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # ------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name hanacv2sql.client.local;

        # ACME http-01 challenge for Let's Encrypt - DO NOT redirect these
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------------
    # HTTPS server
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name hanacv2sql.client.local;

        # ---- TLS ----------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/hanacv2sql.crt;
        ssl_certificate_key /etc/nginx/certs/hanacv2sql.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- Security headers (added on responses we serve) ---------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options          "DENY" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # ---- Logging ------------------------------------------------------
        access_log /var/log/nginx/hanacv2sql.access.log;
        error_log  /var/log/nginx/hanacv2sql.error.log warn;

        # ---- Health check (no auth, fast path to backend) -----------------
        location = /health {
            proxy_pass http://h2s_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---- Backend API --------------------------------------------------
        # Routes all /api/* to the Flask backend.
        # WebSocket-style long polling for conversion status is plain HTTP,
        # so HTTP/1.1 is sufficient.
        location /api/ {
            proxy_pass http://h2s_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;       # stream large downloads
            proxy_request_buffering off;
        }

        # ---- Frontend (everything else) -----------------------------------
        location / {
            proxy_pass http://h2s_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}